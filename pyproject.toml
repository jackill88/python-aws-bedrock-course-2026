[project]
name = "bedrock-architect-course"
version = "1.0.0"
description = "Offline course navigator for the AWS Bedrock lead-architect course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.24.0",
]

[tool.flet]
org = "com.bedrockarchitect"
product = "Bedrock Architect Course"
bundle_id = "com.bedrockarchitect.course"
build_number = 1

[tool.flet.app]
path = "flet_app"
module = "main"

[tool.flet.android]
min_sdk_version = 24

[tool.flet.android.permission]
"android.permission.INTERNET" = false
